training:
  seed: 42
  dataset_name: librispeech_aligned
  output_dir: outputs/hybrid_tts
  learning_rate: 1e-4
  min_learning_rate: 1e-6
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  max_steps: 100000
  logging_steps: 100
  eval_steps: 1000
  eval_num_samples: 100
  save_steps: 1000
  save_total_limit: 3
  report_to: wandb
  wandb_project: hybrid_tts
  wandb_run_name: baseline
