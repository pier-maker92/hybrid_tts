# @package _global_
training:
  dataset_name: librispeech_aligned
  output_dir: checkpoints/exps/token-only

  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  logging_steps: 10
  save_total_limit: 2
  # report
  report_to: wandb
  wandb_project: hybrid_tts
  wandb_run_name: token-only
  run_id: ""
  bf16: true
  # eval
  eval_strategy: "no"
  eval_steps: null
  save_steps: 1000
  eval_num_samples: 4
  num_train_epochs: 100
  # lr
  learning_rate: 1e-4
  min_learning_rate: 1e-5
  lr_scheduler_type: "cosine"   # Change to "linear", "constant", "cosine_with_restarts", etc.
  warmup_ratio: 0.03             # Uses 3% of total training steps for linear warmup
  # cfg
  uncond_prob: 0.0
  no_augment_ratio: 0.7
  discrete_only: true
  # resume
  #resume_from_checkpoint: "/scratch/piermel/hybrid_tts/checkpoints/exps/setting-2/checkpoint-2000"

backbone:
  model_name_or_path: "Qwen/Qwen2-0.5B"
  pretrained: false

diffusion_head: null
#   net_dim: 512
#   net_depth: 6
#   uncond_prob: 0.0
#   use_mlp_sampler: true

continuous_adapter: null
  # hidden_dim: 256
  # num_layers: 2   # Crea 2 strati nascosti + strato di output

vae_checkpoint: "/scratch/piermel/MelCausalVAE/checkpoints/exps/vq-setting-5-dropout-fixed"
vocoder_checkpoint: "vocos"
debug: false

