# @package _global_
training:
  dataset_name: libritts-r-dicodec18-kmeans512-prepared
  train_split: "train"
  output_dir: checkpoints/exps/libritts-r-dicodec18-kmeans512
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  logging_steps: 10
  save_total_limit: 3
  report_to: wandb
  wandb_project: hybrid_tts
  wandb_run_name: libritts-r-dicodec18-kmeans512
  run_id: ""
  bf16: true
  eval_strategy: "no"
  eval_steps: null
  save_steps: 2000
  eval_num_samples: 4
  num_train_epochs: 30
  max_steps: -1
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  uncond_prob: 0.1
  no_augment_ratio: 0.25
  discrete: true
  continuous: true
  group_by_length: false
  dataloader_num_workers: 4

backbone:
  model_type: "qwen-0.5b"
  from_pretrained: false
  shift_audio_offset: 1
  force_weight_tying: false

diffusion_head:
  net_dim: 512
  net_depth: 6
  uncond_prob: 0.0
  use_mlp_sampler: true

continuous_adapter:
  hidden_dim: 512
  num_layers: 4

vae_checkpoint: "/scratch/piermel/MelCausalVAE/checkpoints/paper/disent/dicodec-18"
kmeans_path: "/scratch/piermel/MelCausalVAE/kmeans/512"
continuous_start: 4
vocoder_checkpoint: "vocos"
debug: false
continuous_scaling_mode: "fixed"
