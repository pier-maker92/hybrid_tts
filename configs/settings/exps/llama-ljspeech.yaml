# @package _global_
training:
  dataset_name: ljspeech
  output_dir: checkpoints/exps/llama-ljspeech
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  logging_steps: 10
  save_total_limit: 2
  report_to: wandb
  wandb_project: hybrid_tts
  wandb_run_name: llama-ljspeech
  run_id: ""
  bf16: true
  eval_strategy: "no"
  eval_steps: null
  save_steps: 1000
  eval_num_samples: 4
  num_train_epochs: 100
  max_steps: -1
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  uncond_prob: 0.1
  no_augment_ratio: 0.25
  discrete: true
  continuous: true
  online_encode: true
  group_by_length: false
  dataloader_num_workers: 0

backbone:
  model_type: "llama3"
  num_layers: 12
  num_heads: 4
  n_kv_heads: 1
  hidden_dim: 512
  ffn_dim: 2048
  dropout: 0.0
  rope_theta: 10000.0
  max_position_embeddings: 4096
  from_pretrained: false
  shift_audio_offset: 1
  force_weight_tying: false
  voice_condition: false

diffusion_head:
  net_dim: 512
  net_depth: 6
  net_heads: 8
  uncond_prob: 0.0
  use_mlp_sampler: true
  is_causal: false
  use_conv_layer: false
  voice_condition: false

continuous_adapter:
  hidden_dim: 512
  num_layers: 4

vae_checkpoint: "$SCRATCH/MelCausalVAE/checkpoints/vq-finetune"
text_tokenizer: "char"
use_tokenize: false
bpe_tokenizer_path: "audio_bpe.json"
vocoder_checkpoint: "vocos"
debug: false
continuous_scaling_mode: "learnable"
