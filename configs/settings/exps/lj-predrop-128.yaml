# @package _global_
training:
  dataset_name: lj_speech
  output_dir: checkpoints/exps/lj-predrop-128
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  logging_steps: 1
  save_total_limit: 2
  # report
  report_to: wandb
  wandb_project: hybrid_tts
  wandb_run_name: lj-predrop-128
  run_id: ""
  bf16: true
  # eval
  eval_strategy: "no"
  eval_steps: null
  save_steps: 1000
  eval_num_samples: 4
  num_train_epochs: 100
  # lr
  learning_rate: 3e-4
  min_learning_rate: 1e-5
  lr_scheduler_type: "cosine"   
  warmup_ratio: 0.05         
  # cfg
  uncond_prob: 0.0
  no_augment_ratio: 0.1
  discrete_only: true
  group_by_length: false

backbone:
  num_layers: 8
  num_heads: 16
  hidden_dim: 1024
  ffn_dim: 4096
  dropout: 0.1
  max_position_embeddings: 8192
  vocab_size: 256
  pad_token_id: 0

diffusion_head: null
continuous_adapter: null

vae_checkpoint: "/scratch/piermel/MelCausalVAE/checkpoints/exps/set10_128/checkpoint-32500"
vocoder_checkpoint: "vocos"
debug: false
