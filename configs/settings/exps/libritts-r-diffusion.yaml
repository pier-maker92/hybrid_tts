# @package _global_
training:
  dataset_name: libritts-r-prepared
  output_dir: checkpoints/exps/libritts-r-diffusion
  per_device_train_batch_size: 48
  gradient_accumulation_steps: 1
  logging_steps: 10
  save_total_limit: 2
  # report
  report_to: wandb
  wandb_project: hybrid_tts
  wandb_run_name: libritts-r-diffusion
  run_id: ""
  bf16: true
  # eval
  eval_strategy: "no"
  eval_steps: null
  save_steps: 1000
  eval_num_samples: 4
  num_train_epochs: 10
  # lr
  learning_rate: 3e-4
  min_learning_rate: 1e-5
  lr_scheduler_type: "cosine"   
  warmup_ratio: 0.05         
  # cfg
  uncond_prob: 0.1
  no_augment_ratio: 0.25
  discrete_only: false
  group_by_length: false

diffusion_head: 
  net_dim: 512
  net_depth: 8
  net_heads: 8
  uncond_prob: 0.1
  use_mlp_sampler: false
  is_causal: false
  use_conv_layer: true
  use_window_attention: true

vae_checkpoint: "$SCRATCH/MelCausalVAE/checkpoints/set15-64"
vocoder_checkpoint: "vocos"
debug: false
