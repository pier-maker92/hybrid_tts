# @package _global_
# Llama 3 decoder + character tokenization + online z_sem discrete/continuous training
training:
  dataset_name: librispeech-aligned
  dataset_dir_name: librispeech-aligned
  train_split: "train"
  output_dir: checkpoints/exps/librispeech-aligned-llama3

  # audio len
  max_audio_len: 20
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  logging_steps: 10
  save_total_limit: 3

  # logging
  report_to: wandb
  wandb_project: hybrid_tts
  wandb_run_name: librispeech-aligned-llama3-debug
  run_id: ""

  bf16: true

  # eval and save
  eval_strategy: "steps"
  eval_steps: 30
  eval_num_samples: 4
  save_steps: 2000

  # training
  num_train_epochs: 30
  max_steps: -1
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.001

  # uncond
  uncond_prob: 0.1
  no_augment_ratio: 0.25

  # setting
  discrete: true
  continuous: true
  online_encode: true
  audio_quantizer_source: z_sem
  include_quantizer_residual: true
  semantic_quantizer_checkpoint: "/Users/software/Research/MelCausalVAE/checkpoints/paper/lt/25/quantized/11kstep/z_sem"
  semantic_quantizer_type: vq_ema
  semantic_codebook_size: 1024

  group_by_length: false
  dataloader_num_workers: 8

backbone:
  model_type: "llama3"
  num_layers: 2
  num_heads: 4
  n_kv_heads: 1
  hidden_dim: 64
  ffn_dim: 2048
  dropout: 0.0
  rope_theta: 10000.0
  max_position_embeddings: 4096
  from_pretrained: false
  shift_audio_offset: 1
  force_weight_tying: false
  voice_condition: true

diffusion_head:
  net_dim: 64
  net_depth: 6
  net_heads: 8
  uncond_prob: 0.1
  use_mlp_sampler: false
  is_causal: false
  use_conv_layer: true
  voice_condition: false

continuous_adapter:
  hidden_dim: 64
  num_layers: 4

speaker_adapter:
  hidden_dim: 64
  num_layers: 4

vae_checkpoint: "/Users/software/Research/MelCausalVAE/checkpoints/paper/lt/25"
text_tokenizer: "char"
use_tokenize: false
bpe_tokenizer_path: "audio_bpe.json"
vocoder_checkpoint: "vocos"
debug: false
continuous_scaling_mode: "learnable"
