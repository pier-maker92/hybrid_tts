# @package _global_
training:
  dataset_name: librispeech_aligned
  output_dir: checkpoints/exps/debug

  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  logging_steps: 1
  # report
  report_to: none
  wandb_project: hybrid_tts
  wandb_run_name: debug
  run_id: ""
  bf16: true
  # eval
  eval_strategy: "no"
  eval_steps: null
  save_steps: 1000
  eval_num_samples: 4
  num_train_epochs: 100
  # lr
  learning_rate: 3e-4
  min_learning_rate: 1e-5
  lr_scheduler_type: "cosine"   
  warmup_ratio: 0.05         
  # cfg
  uncond_prob: 0.0
  no_augment_ratio: 0.1
  discrete_only: true
  # use_cpu: false

backbone:
  model_type: "qwen-0.5b"
  from_pretrained: false
  num_layers: 4
  num_heads: 8
  hidden_dim: 512
  ffn_dim: 2048
  dropout: 0.1
  max_position_embeddings: 8192

diffusion_head: null
continuous_adapter: null

vae_checkpoint: "/Users/software/Research/MelCausalVAE/checkpoints/exps/set10-12500"
vocoder_checkpoint: "vocos"
debug: false
